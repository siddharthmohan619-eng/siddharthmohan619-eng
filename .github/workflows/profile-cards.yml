name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  push:
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=siddharthmohan619-eng&show_icons=true&hide_rank=true&bg_color=0d1117&title_color=22d3ee&text_color=c9d1d9&icon_color=a78bfa&border_color=30363d&border_radius=12
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate language bars
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=siddharthmohan619-eng&langs_count=8&card_width=500&bg_color=0d1117&title_color=22d3ee&text_color=c9d1d9&border_color=30363d&border_radius=12
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Save updated cards
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/languages.svg

          if git diff --cached --quiet; then
            echo "Profile cards are unchanged."
            exit 0
          fi

          git commit -m "Update profile statistics"
          git push 
